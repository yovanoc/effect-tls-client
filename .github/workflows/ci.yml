name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx turbo run build test lint format

      - name: Build Bridge for Bun smoke test
        run: |
          package_version="$(
            bun -e 'console.log(
              (await Bun.file("packages/effect-tls-client/package.json").json())
                .version
            )'
          )"
          go build -C bridge \
            -ldflags "-X main.version=$package_version" \
            -o "$RUNNER_TEMP/effect-tls-client-bridge" .

      - name: Test real Bridge with Bun
        run: >-
          cd packages/effect-tls-client &&
          TLS_CLIENT_BRIDGE_PATH="$RUNNER_TEMP/effect-tls-client-bridge"
          bun run test:bun
