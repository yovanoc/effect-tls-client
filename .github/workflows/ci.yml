name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build Bridge for integration tests
        run: bun scripts/build-bridge.ts --host

      - name: Build and validate generated sources
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ github.workspace }}/bridge/bridge
          TLS_CLIENT_INTEGRATION: "1"
        run: bunx turbo run codegen:check build

      - name: Set up Node 25 for BrowserMock checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "25"

      - name: Test browser layer with Node 25
        working-directory: packages/effect-tls-client
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ github.workspace }}/bridge/bridge
          TLS_CLIENT_INTEGRATION: "1"
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/browser.test.ts tests/browser.integration.test.ts

      - name: Run Bun checks in parallel
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ github.workspace }}/bridge/bridge
          TLS_CLIENT_INTEGRATION: "1"
        run: bun run check:bun

      - name: Restore Node 22 for shared checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Test core transport on Node 22
        working-directory: packages/effect-tls-client
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ github.workspace }}/bridge/bridge
          TLS_CLIENT_INTEGRATION: "1"
        run: >-
          node node_modules/vitest/vitest.mjs run
          --exclude tests/browser.test.ts
          --exclude tests/browser.integration.test.ts

      - name: Run shared lint diagnostics
        run: |
          bun run --parallel lint:root format:root
          bunx turbo run lint format \
            --filter=@effect-tls-client/oxlint-config \
            --filter=@effect-tls-client/oxfmt-config

      - name: Test real Bridge with Bun
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ github.workspace }}/bridge/bridge
        run: bun run --cwd packages/effect-tls-client test:bun

      - name: Test real Bridge with Node
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ github.workspace }}/bridge/bridge
        run: node packages/effect-tls-client/tests/bridge.node.mjs

  performance:
    name: compare PR performance and package size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - name: Compare the PR with its base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          bun run benchmark:compare --
          "$BASE_SHA"
          --json "$RUNNER_TEMP/effect-tls-client-performance/report.json"
          --markdown "$RUNNER_TEMP/effect-tls-client-performance/report.md"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-report
          path: ${{ runner.temp }}/effect-tls-client-performance/
          if-no-files-found: error

  integration:
    name: integration (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            bridge_path: packages/bridge-darwin-arm64/bin/bridge
            experimental: false
          - target: darwin-x64
            runner: macos-15-intel
            bridge_path: packages/bridge-darwin-x64/bin/bridge
            experimental: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            bridge_path: packages/bridge-linux-arm64/bin/bridge
            experimental: true
          - target: linux-x64
            runner: ubuntu-latest
            bridge_path: packages/bridge-linux-x64/bin/bridge
            experimental: false
          - target: win32-x64
            runner: windows-latest
            bridge_path: packages/bridge-win32-x64/bin/bridge.exe
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    env:
      TLS_CLIENT_BRIDGE_PATH: ${{ github.workspace }}/${{ matrix.bridge_path }}
      TLS_CLIENT_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build the selected Bridge and TypeScript packages
        run: >-
          bunx turbo run build
          --filter=@effect-tls-client/bridge-${{ matrix.target }}
          --filter=effect-tls-client

      - name: Set up Node 25 for BrowserMock integration tests
        if: matrix.target != 'win32-x64'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "25"

      - name: Run the integration suite
        if: matrix.target != 'win32-x64'
        run: bun run --cwd packages/effect-tls-client test

      - name: Restore Node 22 after BrowserMock integration tests
        if: matrix.target != 'win32-x64'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      # Node cannot spawn a shebang .mjs fixture directly on Windows. The real
      # Bridge integration files exercise the Windows binary without fixtures.
      - name: Run Windows-compatible real integration suite
        if: matrix.target == 'win32-x64'
        run: >-
          bun run --cwd packages/effect-tls-client test --
          tests/session.integration.test.ts
          tests/http-client.integration.test.ts
          tests/websocket.test.ts

      - name: Run the Bun Bridge smoke test
        run: bun run --cwd packages/effect-tls-client test:bun

      - name: Public fingerprint echo (opt-in)
        if: matrix.target == 'linux-x64' && vars.TLS_CLIENT_PUBLIC_ECHO == '1'
        env:
          TLS_CLIENT_PUBLIC_ECHO: "1"
        run: >-
          bun run --cwd packages/effect-tls-client test --
          tests/public-fingerprint.integration.test.ts
