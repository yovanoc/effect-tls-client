name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build Bridge for integration tests
        run: |
          package_version="$(
            bun -e 'console.log(
              (await Bun.file("packages/effect-tls-client/package.json").json())
                .version
            )'
          )"
          go build -C bridge \
            -ldflags "-X main.version=$package_version" \
            -o "$RUNNER_TEMP/effect-tls-client-bridge" .

      - name: Run Turbo checks with the built Bridge
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ runner.temp }}/effect-tls-client-bridge
        run: bunx turbo run build test lint format --force

      - name: Test real Bridge with Bun
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ runner.temp }}/effect-tls-client-bridge
        run: bun run --cwd packages/effect-tls-client test:bun

      - name: Test real Bridge with Node
        env:
          TLS_CLIENT_BRIDGE_PATH: ${{ runner.temp }}/effect-tls-client-bridge
        run: node packages/effect-tls-client/tests/bridge.node.mjs
