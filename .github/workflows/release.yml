name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  build:
    name: Build release artifacts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build and verify generated metadata
        run: bunx turbo run codegen:check build

      - name: Pack and verify all six packages
        env:
          RELEASE_PACK_DIR: ${{ runner.temp }}/effect-tls-client-packages
        run: bun run release:pack

      - name: Archive packed packages
        run: >-
          tar -czf "$RUNNER_TEMP/effect-tls-client-packages.tar.gz"
          -C "$RUNNER_TEMP/effect-tls-client-packages" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages
          path: ${{ runner.temp }}/effect-tls-client-packages.tar.gz
          if-no-files-found: error

  smoke:
    name: Smoke packed release on Node and Bun
    needs: build
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-packages
          path: ${{ runner.temp }}/release-packages-artifact

      - name: Install packed tarballs and run both runtimes
        run: >-
          mkdir -p "$RUNNER_TEMP/effect-tls-client-packages" &&
          tar -xzf
          "$RUNNER_TEMP/release-packages-artifact/effect-tls-client-packages.tar.gz"
          -C "$RUNNER_TEMP/effect-tls-client-packages" &&
          bun scripts/release-smoke.ts
          "$RUNNER_TEMP/effect-tls-client-packages"

  publish:
    name: Publish the fixed package group
    needs: [build, smoke]
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Rebuild the packages before publishing
        run: bunx turbo run build

      - name: Create release pull request or publish to npm
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          publish-script: bun run release
          commit-message: "ci: version packages"
          pr-title: "ci: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
