name: Performance report

on:
  # zizmor: ignore[dangerous-triggers]
  # Trusted job checks out only default branch and never executes PR code.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: >-
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: performance-report
          path: ${{ runner.temp }}/effect-tls-client-performance
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and render the report artifact
        env:
          REPORT_JSON: >-
            ${{ runner.temp }}/effect-tls-client-performance/report.json
          REPORT_MARKDOWN: >-
            ${{ runner.temp }}/effect-tls-client-performance/report.md
        run: |
          node scripts/performance-report.mjs --validate \
            "$REPORT_JSON" "$REPORT_MARKDOWN"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const report = JSON.parse(
            readFileSync(process.env.REPORT_JSON, "utf8"),
          );
          const { renderReport } = await import(
            "./scripts/performance-report.mjs"
          );
          writeFileSync(process.env.REPORT_MARKDOWN, renderReport(report));
          NODE

      - name: Resolve the pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number="$(
            gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '
                map(select(.head.sha == env.HEAD_SHA))
                | if length == 1 then .[0].number
                  else error("expected exactly one matching pull request")
                  end
              '
          )"
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Replace the pull request report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
          REPORT: ${{ runner.temp }}/effect-tls-client-performance/report.md
        run: |
          body="$(cat "$REPORT")"
          comment_id="$(gh api --paginate \
            "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" \
            --jq '
              .[]
              | select(.user.login == "github-actions[bot]")
              | select(
                  .body
                  | contains(
                      "<!-- effect-tls-client performance and size report -->"
                    )
                )
              | .id
            ' \
            | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/$REPOSITORY/issues/comments/$comment_id" \
              --raw-field "body=$body"
          else
            gh api --method POST \
              "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" \
              --raw-field "body=$body"
          fi
